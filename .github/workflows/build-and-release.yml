name: Build and Release qBittorrent for fnOS

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop, test ]
  workflow_dispatch:
    inputs:
      vuetorrent_version:
        description: 'VueTorrent version (e.g., 2.33.0 or "latest")'
        required: false
        default: 'latest'
      qbt_release_tag:
        description: '上游 qbittorrent-nox-static 的 release tag（留空则按 manifest 版本自动匹配，如 release-5.2.4_v2.0.15）'
        required: false
        default: ''

# 工作流级只给读权限：pull_request 触发的构建作业会继承工作流级 permissions，
# 若这里写 contents: write，任何 PR（包括 fork 提的）都能拿到可推送提交、
# 可发 Release 的 token。写权限只在 release 作业内单独声明（见该作业）。
permissions:
  contents: read

env:
  # 以前这里硬编码 "latest"：workflow_dispatch 声明了 vuetorrent_version 输入
  # 却从没被用上，手动指定版本会被静默忽略。改为读输入（未提供/非 dispatch
  # 事件时 inputs 为空，回退 latest）。实际解析出的版本会在 VueTorrent 步骤里
  # 回写到 VUETORRENT_RESOLVED 并打印，保证同 tag 重建可复现。
  VUETORRENT_VERSION: ${{ inputs.vuetorrent_version || 'latest' }}

# 同一 tag 只允许一次构建：避免重复触发导致两个构建并发运行，
# 以及第二个构建的 gh release create 因 Release 已存在而失败。
concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build qBittorrent - ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            download_arch: aarch64
            fnpack_arch: arm
            # `file` 输出里必须出现的架构串，用于断言下载到的确实是目标架构的二进制
            file_token: aarch64
          - arch: amd64
            runner: ubuntu-latest
            download_arch: x86_64
            fnpack_arch: amd64
            file_token: x86-64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read version from manifest
        run: |
          APP_VERSION=$(grep "^version\s*=" manifest | sed 's/version\s*=\s*//' | tr -d ' ')
          QBT_VER=$(echo "$APP_VERSION" | cut -d. -f1-3)
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "QBT_VER=${QBT_VER}" >> $GITHUB_ENV
          echo "APP_VERSION=${APP_VERSION}"
          echo "QBT_VER=${QBT_VER}"

      # 仓库里的 scripts/test_*.py 是纯本地回归测试（用临时目录、桩程序，不需要
      # NAS 凭据）。以前 CI 从不跑它们，cmd/main 的启动自愈、配置键解析被改坏
      # 也照样能出包，只能等用户在 NAS 上踩到。
      # 只显式列「无外部依赖」的四个：其余 test_*.py / verify_*.py 需要真机或
      # NAS 凭据（QBT_NAS_HOST/USER/PASS），放进 CI 只会永远红。
      # 放在下载 70MB 二进制之前，坏代码尽早失败。
      - name: Run local regression tests
        run: |
          set -e
          TESTS="
            scripts/test_main_start_recovery.py
            scripts/test_config_key_forms.py
            scripts/test_mcp_hardening.py
            scripts/test_profile_acl.py
          "
          for t in ${TESTS}; do
            if [ ! -f "${t}" ]; then
              echo "::error::测试脚本不存在: ${t}"
              exit 1
            fi
            echo "=== ${t} ==="
            python3 "${t}"
          done
          echo "本地回归测试全部通过"

      - name: Fetch latest qBittorrent-nox release
        run: |
          QBT_API="https://api.github.com/repos/userdocs/qbittorrent-nox-static/releases?per_page=100"

          # 优先使用调用方显式指定的 tag（每月同步工作流会传入它解析出的上游 tag），
          # 保证「构建用的二进制」与「manifest/changelog 记录的版本」严格一致；
          # 否则退化为按 qBittorrent 版本前缀匹配，并取 libtorrent 最高的一条。
          QBT_RELEASE_TAG="${{ inputs.qbt_release_tag }}"

          if [ -z "$QBT_RELEASE_TAG" ]; then
            # tag 形如 release-<qbt>_v<libtorrent>：字段1=release-<qbt>，字段2=v<libtorrent>
            # 两个字段都按版本序排序，取最高的一条，避免选中旧 libtorrent 的重建版本
            QBT_RELEASE_TAG=$(curl -fsSL "$QBT_API" \
              | grep '"tag_name"' \
              | sed -E 's/.*"tag_name"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/' \
              | grep -E "^release-${QBT_VER//./\\.}_v[0-9]+(\.[0-9]+)*$" \
              | sort -t_ -k1,1V -k2,2V \
              | tail -1)
          fi

          if [ -z "$QBT_RELEASE_TAG" ]; then
            echo "ERROR: No qBittorrent-nox release found for version ${QBT_VER}"
            exit 1
          fi
          echo "QBT_RELEASE_TAG=${QBT_RELEASE_TAG}" >> $GITHUB_ENV
          echo "qBittorrent-nox release: ${QBT_RELEASE_TAG}"

      - name: Download qBittorrent static binary
        run: |
          DOWNLOAD_ARCH="${{ matrix.download_arch }}"
          STATIC_URL="https://github.com/userdocs/qbittorrent-nox-static/releases/download/${QBT_RELEASE_TAG}/${DOWNLOAD_ARCH}-qbittorrent-nox"

          echo "Downloading qbittorrent-nox ${QBT_RELEASE_TAG} for ${DOWNLOAD_ARCH}..."
          wget -v "${STATIC_URL}" -O qbittorrent-nox
          chmod +x qbittorrent-nox

          echo "Verifying binary..."
          FILE_OUT="$(file -b qbittorrent-nox)"
          echo "${FILE_OUT}"

          # 架构断言：file 的输出必须明确指出目标架构。
          # 以前只打印 file 结果不校验，下错架构（例如 arm64 作业拿到 x86_64 二进制）
          # 也能一路打包出 fpk，装到 NAS 上才表现为"应用起不来"。
          if ! printf '%s' "${FILE_OUT}" | grep -qF "${{ matrix.file_token }}"; then
            echo "::error::二进制架构不符：期望包含 '${{ matrix.file_token }}'，实际 '${FILE_OUT}'"
            exit 1
          fi

          VERSION_OUTPUT="$(./qbittorrent-nox --version 2>&1 || true)"
          echo "${VERSION_OUTPUT}"

          # 空输出以前只 ::warning:: 掉，等于版本一致性校验可以被"没输出"绕过。
          # 读不到版本就无法证明二进制与 manifest 一致，直接失败。
          if [ -z "${VERSION_OUTPUT}" ]; then
            echo "::error::无法读取二进制版本（--version 无输出），拒绝继续打包"
            exit 1
          fi

          # 精确比较：以前用 grep -qF 做子串匹配，QBT_VER=5.2.4 会命中 5.2.40，
          # 也会命中任何含该串的错误信息。这里先归一化出一行版本号再按相等比较。
          # 优先取以 "qBittorrent" 开头的那行（--version 的标准首行）；
          # 都没有就失败，而不是拿第一行凑数（那会把错误页里的数字当版本号）。
          VERSION_LINE="$(printf '%s\n' "${VERSION_OUTPUT}" | tr -d '\r' | grep -i -m1 '^[[:space:]]*qbittorrent' || true)"
          if [ -z "${VERSION_LINE}" ]; then
            VERSION_LINE="$(printf '%s\n' "${VERSION_OUTPUT}" | tr -d '\r' | grep -i -m1 'qbittorrent' || true)"
          fi
          if [ -z "${VERSION_LINE}" ]; then
            echo "::error::--version 输出里找不到 qBittorrent 版本行，拒绝继续打包：${VERSION_OUTPUT}"
            exit 1
          fi
          BIN_VER="$(printf '%s\n' "${VERSION_LINE}" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)*' | head -1)"
          echo "解析出的二进制版本: ${BIN_VER:-（空）}，期望: ${QBT_VER}"

          if [ "${BIN_VER}" = "${QBT_VER}" ]; then
            echo "二进制版本与 manifest 一致：qBittorrent ${QBT_VER}"
          else
            echo "::error::二进制版本与 manifest 不一致：期望 ${QBT_VER}，实际 ${BIN_VER:-（空）}"
            echo "  完整输出: ${VERSION_OUTPUT}"
            exit 1
          fi

      - name: Download and prepare VueTorrent WebUI
        env:
          # 只读公开仓库的 release 信息，contents: read 足够
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 版本归一化：输入既可能是 "2.33.0" 也可能是 "v2.33.0"（GitHub 的 tag 带 v，
          # 输入说明里写的是不带 v）。以前直接把输入拼进 download/<ver>/ 的 URL，
          # 传 "2.33.0" 会 404；这里统一去掉前导 v，拼 URL 时再加回来。
          VUE_SPEC="${VUETORRENT_VERSION:-latest}"
          VUE_SPEC="${VUE_SPEC#v}"

          if [ "${VUE_SPEC}" = "latest" ]; then
            # latest 会随时间漂移：同一个 tag 隔几天重建会拿到不同的 WebUI。
            # 这里把 latest 解析成具体版本号并在下面打印 + 回写，保证可复现。
            VUE_VER="$(gh api repos/VueTorrent/VueTorrent/releases/latest --jq .tag_name 2>/dev/null | tr -d ' \r\n' || true)"
            VUE_VER="${VUE_VER#v}"
            if [ -n "${VUE_VER}" ]; then
              echo "VueTorrent latest -> ${VUE_VER}"
            else
              echo "::warning::无法解析 VueTorrent latest 的具体版本号，退回 latest/download 链接（本次构建不可复现）"
            fi
          else
            VUE_VER="${VUE_SPEC}"
          fi

          if [ -n "${VUE_VER}" ]; then
            VUETORRENT_URL="https://github.com/VueTorrent/VueTorrent/releases/download/v${VUE_VER}/vuetorrent.zip"
            VUE_LICENSE_URL="https://raw.githubusercontent.com/VueTorrent/VueTorrent/v${VUE_VER}/LICENSE"
            # 回写实际使用的版本：后续步骤/摘要读它，日志里也留一份（同 tag 重建可复现）
            echo "VUETORRENT_RESOLVED=${VUE_VER}" >> "$GITHUB_ENV"
            echo "实际使用的 VueTorrent 版本: ${VUE_VER}（请求: ${VUETORRENT_VERSION:-latest}）"
          else
            VUE_VER="unresolved-latest"
            VUETORRENT_URL="https://github.com/VueTorrent/VueTorrent/releases/latest/download/vuetorrent.zip"
            VUE_LICENSE_URL="https://raw.githubusercontent.com/VueTorrent/VueTorrent/master/LICENSE"
            echo "VUETORRENT_RESOLVED=${VUE_VER}" >> "$GITHUB_ENV"
            echo "实际使用的 VueTorrent 版本: ${VUE_VER}"
          fi

          echo "Downloading VueTorrent ${VUE_VER}..."
          wget -q "$VUETORRENT_URL" -O vuetorrent.zip

          if [ ! -s vuetorrent.zip ]; then
            echo "ERROR: Failed to download VueTorrent"
            exit 1
          fi

          echo "Extracting VueTorrent..."
          unzip -q vuetorrent.zip

          echo "Setting up VueTorrent as alternative WebUI..."
          mkdir -p app/ui/vuetorrent/public
          if [ -d "vuetorrent/public" ]; then
            cp -r vuetorrent/* app/ui/vuetorrent/
            rm -rf app/ui/vuetorrent/screenshots
            chmod -R a+r app/ui/vuetorrent/
          else
            echo "ERROR: VueTorrent directory not found"
            exit 1
          fi

          rm -rf vuetorrent vuetorrent.zip

          echo "Fetching VueTorrent LICENSE (MIT)..."
          wget -q "$VUE_LICENSE_URL" -O app/ui/vuetorrent/LICENSE || echo "WARNING: failed to fetch VueTorrent LICENSE (MIT notice may be missing in package)"

          # 把版本落盘，随 source 一起留在工作区，方便事后核对构建输入
          printf 'vuetorrent=%s\nrequested=%s\n' \
            "${VUE_VER}" "${VUETORRENT_VERSION:-latest}" > vuetorrent-version.txt

      - name: Inject update check into VueTorrent WebUI
        run: |
          if [ -f app/ui/update-check.js ]; then
            cp app/ui/update-check.js app/ui/vuetorrent/public/
            echo "update-check.js copied to VueTorrent"
          else
            echo "ERROR: update-check.js not found"
            exit 1
          fi

          VUE_INDEX="app/ui/vuetorrent/public/index.html"
          ARCH="${{ matrix.arch }}"
          if [ -f "$VUE_INDEX" ]; then
            if grep -q "QBITTORRENT_APP_VERSION" "$VUE_INDEX"; then
              sed -i "s/window\.QBITTORRENT_APP_VERSION = '[^']*'/window.QBITTORRENT_APP_VERSION = '$APP_VERSION'/g" "$VUE_INDEX"
              if grep -q "QBITTORRENT_APP_ARCH" "$VUE_INDEX"; then
                sed -i "s/window\.QBITTORRENT_APP_ARCH = '[^']*'/window.QBITTORRENT_APP_ARCH = '$ARCH'/g" "$VUE_INDEX"
              else
                sed -i "/window\.QBITTORRENT_APP_VERSION = '[^']*'/a\\          window.QBITTORRENT_APP_ARCH = '$ARCH'" "$VUE_INDEX"
              fi
              echo "Update check version/arch updated to $APP_VERSION/$ARCH"
            else
              awk -v ver="$APP_VERSION" -v arch="$ARCH" '
                /<\/body>/ {
                  print "      <script>"
                  print "          window.QBITTORRENT_APP_VERSION = '\''" ver "'\'';"
                  print "          window.QBITTORRENT_APP_ARCH = '\''" arch "'\'';"
                  print "      </script>"
                  print "      <script src=\"update-check.js\"></script>"
                  print ""
                }
                { print }
              ' "$VUE_INDEX" > "$VUE_INDEX.tmp" && mv "$VUE_INDEX.tmp" "$VUE_INDEX"
              echo "Update check injected into VueTorrent ($APP_VERSION/$ARCH)"
            fi
          else
            echo "ERROR: VueTorrent index.html not found"
            exit 1
          fi

      - name: Prepare app structure
        run: |
          if [ ! -f qbittorrent-nox ]; then
            echo "ERROR: qbittorrent binary not found!"
            exit 1
          fi

          mkdir -p app/bin app/ui cmd config wizard

          echo "Copying binary to app/bin/..."
          cp qbittorrent-nox app/bin/
          chmod +x app/bin/qbittorrent-nox

          if [ -f app/bin/gateway-proxy.py ]; then
            chmod +x app/bin/gateway-proxy.py
            echo "gateway-proxy.py ready (reverse proxy + MCP host)"
          fi

          if [ -f app/bin/mcp-server.py ]; then
            chmod +x app/bin/mcp-server.py
            echo "mcp-server.py ready (MCP Server for AI clients)"
          else
            echo "ERROR: app/bin/mcp-server.py not found (MCP service is required)"
            exit 1
          fi

          if [ -f app/bin/qbt_password.py ]; then
            chmod +x app/bin/qbt_password.py
            echo "qbt_password.py ready"
          else
            echo "WARNING: qbt_password.py not found"
          fi

          echo "Binary: $(ls -lh app/bin/qbittorrent-nox | awk '{print $5}')"
          echo "VueTorrent files: $(ls -1 app/ui/vuetorrent/ 2>/dev/null | wc -l)"

      - name: Create .fpk package
        run: |
          FNPACK_URL="https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-${{ matrix.fnpack_arch }}"
          echo "Downloading fnpack from: $FNPACK_URL"
          wget -q "$FNPACK_URL" -O fnpack
          chmod +x fnpack

          echo "Verifying required files..."
          for file in manifest ICON.PNG ICON_256.PNG README.md LICENSE THIRD_PARTY_LICENSES.md app cmd config wizard; do
            if [ ! -e "$file" ]; then
              echo "ERROR: Required file/directory '$file' not found!"
              exit 1
            fi
            echo "  ✓ $file"
          done

          echo "Running fnpack build..."
          ./fnpack build .

          if [ ! -f qbittorrent.fpk ]; then
            echo "ERROR: fnpack did not generate qbittorrent.fpk"
            exit 1
          fi

          PACKAGE_NAME="qbittorrent-${APP_VERSION}-${{ matrix.arch }}.fpk"
          mv qbittorrent.fpk "${PACKAGE_NAME}"

          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
          echo "Created package: ${PACKAGE_NAME}"
          ls -lh "${PACKAGE_NAME}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qBittorrent-${{ matrix.arch }}-fpk
          path: ${{ env.PACKAGE_NAME }}
          retention-days: 30

      - name: Build summary
        run: |
          # 用 shell 变量而不是 ${{ env.XXX }}：VUETORRENT_RESOLVED 是本作业内
          # 运行时写进 GITHUB_ENV 的，表达式上下文取不到它的运行时值。
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## ✅ Build Summary - ${{ matrix.arch }}

          **Version:** ${APP_VERSION}
          **Architecture:** ${{ matrix.arch }}
          **qBittorrent-nox Release:** ${QBT_RELEASE_TAG}
          **VueTorrent Version:** ${VUETORRENT_RESOLVED:-${VUETORRENT_VERSION}}（请求: ${VUETORRENT_VERSION}）
          **MCP Server:** ✓ included (app/bin/mcp-server.py, 高危操作开关默认关闭)

          **Git Info:**
          - Commit: \`${{ github.sha }}\`
          - Branch: \`${{ github.ref_name }}\`

          **Package:** \`${PACKAGE_NAME}\`
          EOF

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 写权限只给这一个作业：gh release create 需要 contents: write。
    # 工作流级保持 contents: read，PR 构建作业因此拿不到可发布的 token。
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Read version from manifest
        run: |
          APP_VERSION=$(grep "^version\s*=" manifest | sed 's/version\s*=\s*//' | tr -d ' ')
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV

      - name: Publish Release with Changelog
        run: |
          # 只取第一条 changelog：manifest 若残留历史累加的多条 changelog 行，
          # 全量 grep 会把所有版本拼进发布说明。更新日志只保留最新版本。
          CHANGELOG=$(grep -m1 "^changelog" manifest | sed 's/changelog\s*=\s*//' | sed 's/<br>/\n/g')

          TAG="${{ github.ref_name }}"

          echo "Publishing release..."
          gh release create "$TAG" \
            artifacts/qBittorrent-arm64-fpk/*.fpk \
            artifacts/qBittorrent-amd64-fpk/*.fpk \
            --title "$TAG" \
            --notes "$CHANGELOG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
